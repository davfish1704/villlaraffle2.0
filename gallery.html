<head>
  <meta charset="UTF-8">

  <title>Photo Gallery | The Loft Padonan | Canggu</title>
  <meta name="description" content="Photo gallery of The Loft Padonan. 120m² industrial luxury loft in Canggu, Bali. Built 2023.">

  <link rel="manifest" href="https://cangguloftstylecollection.com/assets/icons/site.webmanifest">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Canggu Loft Style Collection",
      "url": "https://cangguloftstylecollection.com",
      "logo": "https://cangguloftstylecollection.com/assets/icons/logo-square-512.png"
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="bg-stone-50">
  <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md border-b border-stone-200 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="font-serif text-xl">The Loft <span class="text-gold">Padonan</span></a>
      <a href="/" class="text-sm text-stone-600 hover:text-gold">← Back</a>
    </div>
  </nav>

  <main class="pt-24 pb-12 max-w-7xl mx-auto px-4 sm:px-6">
    <h1 class="font-serif text-3xl md:text-4xl mb-2">Property <span class="text-gold italic">Gallery</span></h1>
    <p class="text-stone-600 mb-8">120m² industrial loft • Padonan, Canggu • Built 2023</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="gallery">
      <!-- Images loaded via JS for lazy loading -->
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 bg-black/95 z-50 hidden items-center justify-center" onclick="closeLightbox()">
    <img id="lightboxImg" src="" class="max-w-full max-h-full p-4 object-contain">
    <button class="absolute top-4 right-4 text-white text-4xl">&times;</button>
  </div>

  <script>
    const images = [
      { src: '/assets/images/hero-loft.webp', title: 'Exterior View' },
      { src: '/assets/images/living.webp', title: 'Living Space' },
      { src: '/assets/images/kitchen.webp', title: 'Kitchen Detail' },
      { src: '/assets/images/bedroom.webp', title: 'Master Bedroom' },
      { src: '/assets/images/bathroom.webp', title: 'Bathroom' },
      { src: '/assets/images/balcony.webp', title: 'Balcony' },
      { src: '/assets/images/gallery-placeholder.svg', title: 'Living 2 (Coming Soon)' },
      { src: '/assets/images/gallery-placeholder.svg', title: 'Dining Area (Coming Soon)' },
      { src: '/assets/images/gallery-placeholder.svg', title: 'Kitchen Detail 2 (Coming Soon)' },
      { src: '/assets/images/gallery-placeholder.svg', title: 'Second Bedroom (Coming Soon)' }
    ];
    
    const gallery = document.getElementById('gallery');
    images.forEach((img, idx) => {
      const div = document.createElement('div');
      div.className = 'aspect-[4/3] overflow-hidden rounded-lg cursor-pointer hover:opacity-90 transition';
      div.onclick = () => openLightbox(idx);
      div.innerHTML = `
        <img src="${img.src}" alt="${img.title}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition duration-500">
        <div class="p-2 bg-white text-xs text-stone-500 text-center">${img.title}</div>
      `;
      gallery.appendChild(div);
    });
    
    function openLightbox(idx) {
      document.getElementById('lightboxImg').src = images[idx].src;
      document.getElementById('lightbox').classList.remove('hidden');
      document.getElementById('lightbox').classList.add('flex');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.getElementById('lightbox').classList.remove('flex');
    }
  </script>

</body>
