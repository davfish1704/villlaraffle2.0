<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | The Loft Padonan</title>
  <meta name="description" content="Thank you for your inquiry. Your request has been received and you are being redirected to the full exposé.">
  <meta name="application-name" content="Canggu Loft Style Collection">
  <meta name="apple-mobile-web-app-title" content="Canggu Loft Style Collection">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="https://cangguloftstylecollection.com/assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="https://cangguloftstylecollection.com/assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="https://cangguloftstylecollection.com/assets/icons/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://cangguloftstylecollection.com/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="https://cangguloftstylecollection.com/assets/icons/site.webmanifest">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Canggu Loft Style Collection",
      "url": "https://cangguloftstylecollection.com",
      "logo": "https://cangguloftstylecollection.com/assets/icons/logo-square-512.png"
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="min-h-screen bg-stone-900 text-white antialiased">
  <main class="min-h-screen flex items-center justify-center p-4">
    <section class="w-full max-w-xl bg-white/10 border border-white/20 rounded-2xl p-6 sm:p-8 text-center backdrop-blur-md">
      <div class="w-16 h-16 mx-auto rounded-full bg-emerald-500/20 border border-emerald-300/40 flex items-center justify-center mb-5">
        <svg viewBox="0 0 24 24" class="w-9 h-9 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <p class="uppercase text-[11px] tracking-[0.2em] text-stone-300 mb-2">Inquiry Confirmed</p>
      <h1 class="font-serif text-3xl sm:text-4xl text-white mb-3">Thank you for your interest</h1>
      <p class="text-stone-200 text-sm sm:text-base mb-6">Your details were saved successfully. You are now being redirected to the full property exposé.</p>

      <div class="bg-black/20 rounded-xl p-4 mb-6">
        <p class="text-xs uppercase tracking-wider text-stone-300 mb-2">Redirect in</p>
        <p id="redirectCountdown" class="text-3xl font-semibold text-gold">5s</p>
      </div>

      <div class="grid gap-3 sm:grid-cols-2">
        <a href="/expose.html?qualified=true" class="btn btn-primary">Open Exposé</a>
        <button type="button" id="startNewBtn" class="btn btn-secondary">Start New Inquiry</button>
      </div>
    </section>
  </main>

  <script>
    const SUBMITTED_KEY = 'loftLeadFormSubmitted';
    const STORAGE_KEY = 'loftLeadFormDraft';

    let seconds = 5;
    const countdownEl = document.getElementById('redirectCountdown');

    const timer = setInterval(() => {
      seconds -= 1;
      countdownEl.textContent = `${seconds}s`;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace('/expose.html?qualified=true');
      }
    }, 1000);

    document.getElementById('startNewBtn').addEventListener('click', () => {
      sessionStorage.removeItem(SUBMITTED_KEY);
      localStorage.removeItem(STORAGE_KEY);
      window.location.href = '/';
    });
  </script>
</body>
</html>
